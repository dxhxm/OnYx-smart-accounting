# =============================================================================
# OnYx Prometheus Configuration
# =============================================================================
# Scrapes metrics from Node Exporter, cAdvisor, Prometheus, and OnYx App.
# Streams metrics to Grafana Cloud via authenticated remote_write.
# =============================================================================

global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate alert rules every 15 seconds
  scrape_timeout: 10s       # Timeout if target doesn't respond in 10s

  # Attach these default labels to all time-series collected
  external_labels:
    environment: 'demo'
    project: 'onyx-smart-accounting'
    region: 'ap-southeast-2'

# -----------------------------------------------------------------------------
# Grafana Cloud Remote Write (Outbound telemetry push)
# -----------------------------------------------------------------------------
remote_write:
  - url: https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push
    basic_auth:
      username: '3793866'
      password_file: '/etc/prometheus/grafana_token'

# Scrape job definitions
scrape_configs:
  # ---------------------------------------------------------------------------
  # 1. Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------------------------------------------------------------------
  # 2. Linux OS & Hardware metrics (Node Exporter)
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ---------------------------------------------------------------------------
  # 3. Docker Container metrics (cAdvisor)
  # ---------------------------------------------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ---------------------------------------------------------------------------
  # 4. OnYx Next.js Application Telemetry (RED Metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'onyx-app'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['app:3000']
