name: PR Continuous Integration

on:
  pull_request:
    branches:
      - main

# Least privilege: PR workflows only need read access to repository contents
permissions:
  contents: read

# Automatically cancel out-of-date runs when new commits are pushed to the same PR
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Static Quality & Unit Tests
  # Verifies TypeScript typing and executes Vitest test suite
  # ===========================================================================
  quality-and-test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Static Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite
        run: npm run test:ci

  # ===========================================================================
  # 2. Production Build Verification
  # Verifies that Next.js standalone build compiles cleanly
  # ===========================================================================
  build-verification:
    name: Next.js Production Build
    needs: quality-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js standalone bundle
        run: npm run build

