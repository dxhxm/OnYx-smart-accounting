# =============================================================================
# OnYx Observability Stack — Exporters & Prometheus TSDB
# =============================================================================
# Collects host OS hardware metrics, Docker container stats, and Prometheus TSDB.
# Streams telemetry outbound to Grafana Cloud.
# All metrics ports are bound exclusively to 127.0.0.1 and internal Docker network.
# =============================================================================

name: onyx-monitoring

services:
  # ---------------------------------------------------------------------------
  # Node Exporter: Host Hardware and OS Kernel Metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: onyx-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      # Bound strictly to localhost; never exposed to internet
      - 127.0.0.1:9100:9100
    networks:
      - onyx_network

  # ---------------------------------------------------------------------------
  # cAdvisor: Container-level Resource and Performance Metrics
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: onyx-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/kmsg:/dev/kmsg
    ports:
      # Bound strictly to localhost; never exposed to internet
      - 127.0.0.1:8080:8080
    networks:
      - onyx_network

  # ---------------------------------------------------------------------------
  # Prometheus: Time-Series Metrics Database & Scrape Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: onyx-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana_token:/etc/prometheus/grafana_token:ro
      - prometheus_data:/prometheus
    ports:
      # Bound strictly to localhost; never exposed to internet
      - 127.0.0.1:9090:9090
    networks:
      - onyx_network
    depends_on:
      - node-exporter
      - cadvisor

volumes:
  prometheus_data:
    name: onyx_prod_prometheus_data

networks:
  onyx_network:
    name: onyx_prod_network
    external: true
